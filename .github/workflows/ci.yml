name: Build & Quality Checks

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop


jobs:
  tests:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: appointment_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven


      - name: Make mvnw executable
        run: chmod +x mvnw


      - name: Run tests
        run: ./mvnw verify


  checkstyle:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven


      - name: Make mvnw executable
        run: chmod +x mvnw


      - name: Run Checkstyle
        run: ./mvnw checkstyle:check


      - name: Run Checkstyle (report)
        if: always()
        run: ./mvnw checkstyle:checkstyle
        continue-on-error: true


      - name: Parse Checkstyle results and comment on PR
        if: always() && github.event_name == 'pull_request'
        run: |
          java ci/CheckstyleReporter.java \
            target/checkstyle-result.xml \
            ${{ github.repository }} \
            ${{ github.event.pull_request.number }} \
            ${{ secrets.GITHUB_TOKEN }}