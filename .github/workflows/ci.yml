name: CI - Running tests

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop


jobs:
  ci:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: appointment_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven


      - name: Make mvnw executable
        run: chmod +x mvnw


      - name: Run tests
        run: ./mvnw verify