services:
  app:
    container_name: app
    build: .
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

  postgres:
    container_name: appointment-system-postgres
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: appointment_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - appointment-system-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  appointment-system-postgres-data: